name: Worker tick

# Runs queued jobs (discovery, automations, campaigns) on a schedule.
# Vercel Hobby only allows daily crons; GitHub Actions' minimum interval is 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: worker-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/worker/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secrets APP_URL and CRON_SECRET must be set"
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/worker/tick")
          echo "HTTP $code"
          cat response.json
          [ "$code" = "200" ]
